<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in WhatsApp</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #128c7e;
            --text-white: #ffffff;
            --title-color: #202020;
            --text-color: #505050;
            --jha-font: Outfit, Helvetica, Arial, sans-serif;
        }
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            justify-items: center;
            align-items: center;
            font-family: var(--jha-font);
            accent-color: var(--accent-color);
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;
            gap: 8px;
            padding-top: 120px;
            border: var(--accent-color) 1px solid;
            border-radius: 32px;
            padding: 32px;
            width: min(360px, calc(100% - 96px));
            margin-top: -20vh;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 108%;
            margin: 0px;
            color: var(--title-color);
        }
        .paragraph {
            font-size: 1rem;
            font-weight: 400;
            line-height: 140%;
            color: var(--text-color);
        }
        .highlight {
            color: var(--title-color);
            font-weight: 600;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }
        .input-field {
            display: flex;
            flex-grow: 1;
            padding: 16px 24px;
            border: 1px solid #80808080;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 400;
            line-height: 120%;
            background-color: #f9f9fa;
            font-family: var(--jha-font);
            letter-spacing: 0.05rem;
        }
        .input-field:focus {
            border: 1px solid var(--accent-color);
            outline: none;
        }
        .button {
            display: flex;
            align-content: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: var(--text-white);
            padding: 16px 32px;
            border-radius: 40px;
            border: none;
            font-size: 16px;
            font-weight: 400;
            line-height: 120%;
            cursor: pointer;
            font-family: var(--jha-font);
            margin-top: 16px;
        }
        .button:hover {
            background-color: #25d366;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat without saving number</h1>
        <span class="paragraph">Select the <span class="highlight">country code</span> from the dropdown, then enter the mobile number and click the button to create a new chat on WhatsApp.</span>
        <div class="input-container">
            <select id="countryCode" class="input-field">
                <option value="880">Bangladesh +880</option>
                <option value="62">Indonesia +62</option>
                <option value="31">Netherlands +31</option>
                <option value="1">USA +1</option>
                <option value="">Custom</option>
                <!-- Add more country codes as needed -->
            </select>
            <input type="tel" id="mobileNumber" class="input-field" placeholder="Mobile number" required oninput="validateInput(this)" onkeypress="handleKeyPress(event)" inputmode="tel" pattern="[0-9]*" minlength="8">
        </div>
        <button class="button" onclick="openWhatsApp()">Open in WhatsApp</button>
    </div>
    <script>
        function validateInput(input) {
            let value = input.value;
            // Allow only digits
            input.value = value.replace(/[^0-9]/g, '');
        }

        function openWhatsApp() {
            var countryCode = document.getElementById('countryCode').value;
            var number = document.getElementById('mobileNumber').value;
            window.open('https://wa.me/' + countryCode + number, '_blank');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                openWhatsApp();
            }
        }
    </script>
</body>
</html>
